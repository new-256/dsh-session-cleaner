# dsh-session-cleaner — bundle 补丁层（标准分发形态）
#
# 本文件由 DSH 插件系统在安装后自动作为 profile 的 bundle 层挂载：
#   dsh plugin --profile web add @luchenglong/dsh-session-cleaner   (npm registry)
#   dsh plugin --profile web add <本地包路径>                    (本地安装)
# 声明位置: package.json 的 dsh.bundle.patch。
#
# host 半边用裸包名解析（package.json main → lib/index.mjs），纯宿主实现，
# 无 client 半边（注入脚本经由 webserver/index-inject 事件由服务端下发）。
#
# 此处只放通用默认值。机器特定配置（如 verbose 调优）请写在用户层补丁
#   Windows: %APPDATA%\DSH Desktop\dsh-home\cordis.patch.yml
# 的同 id 行里 — 用户层后应用，按行 id 整体覆盖本行 config。
- insert:
    - id: session-cleaner
      name: @luchenglong/dsh-session-cleaner
      config:
        verbose: false